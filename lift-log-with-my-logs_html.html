<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1b17">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lift Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&display=swap">
<style>
/* Layout: one calm column, app-style bottom tabs; earth palette (moss, clay, slate, ochre, rust on sand / bark). */
:root{
  --bg:#ece7dc;--surface:#f7f4ed;--surface-2:#e5dfd2;--line:#d8d0c0;
  --text:#2a2823;--muted:#756f62;--faint:#a69f90;
  --accent:#58704a;--accent-ink:#f7f4ed;--accent-soft:#dde3d2;
  --good:#58704a;--good-soft:#dde3d2;--warn:#a87a26;--warn-soft:#efe2c6;--bad:#a4492f;--bad-soft:#f0d9cf;
  --c-push:#b0613d;--c-pull:#4d6b68;--c-legs:#7b7f3e;--c-ca:#b98d3c;--c-cb:#8b5148;--c-x:#7a6a58;--rest:#9384ad;--rest-soft:#e6e1ee;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --radius:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1b17;--surface:#25231e;--surface-2:#2e2b25;--line:#3a362e;
  --text:#ebe5d8;--muted:#a69e8c;--faint:#6f6859;
  --accent:#9db384;--accent-ink:#1c1b17;--accent-soft:#2f3828;
  --good:#9db384;--good-soft:#2f3828;--warn:#d9ad5b;--warn-soft:#3b3020;--bad:#d9805f;--bad-soft:#3e271f;
  --c-push:#d4825c;--c-pull:#7fa09b;--c-legs:#aab063;--c-ca:#d9ad5b;--c-cb:#bf7c70;--c-x:#a8957e;--rest:#ab9cc8;--rest-soft:#372f47;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1c1b17;--surface:#25231e;--surface-2:#2e2b25;--line:#3a362e;
  --text:#ebe5d8;--muted:#a69e8c;--faint:#6f6859;
  --accent:#9db384;--accent-ink:#1c1b17;--accent-soft:#2f3828;
  --good:#9db384;--good-soft:#2f3828;--warn:#d9ad5b;--warn-soft:#3b3020;--bad:#d9805f;--bad-soft:#3e271f;
  --c-push:#d4825c;--c-pull:#7fa09b;--c-legs:#aab063;--c-ca:#d9ad5b;--c-cb:#bf7c70;--c-x:#a8957e;--rest:#ab9cc8;--rest-soft:#372f47;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px 28px}
h1,h2,h3,.disp{font-family:var(--display);letter-spacing:-.015em;text-wrap:balance}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:12px 0 18px;flex-wrap:wrap}
header.top h1{font-size:32px;line-height:1.05;margin:0;font-weight:750}
header.top .sub{color:var(--muted);font-size:13.5px;margin-top:6px}
.card{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card h3{margin:0;font-size:17px;font-weight:650}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}.tiny{font-size:11.5px}
.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.wrapf{flex-wrap:wrap}.grow{flex:1;min-width:0}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11.5px;font-weight:650;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:26px 2px 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 16px;border-radius:12px;background:var(--surface-2);font-weight:600;font-size:14px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%;height:52px;font-size:16px;border-radius:14px}
.icon-btn{width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--surface-2)}
.field{width:100%;background:var(--surface-2);border:1px solid transparent;border-radius:11px;padding:10px 12px;outline:none;min-height:44px}
.field:focus{border-color:var(--accent)}
textarea.field{resize:vertical;min-height:76px}
label.lbl{display:block;font-size:12px;color:var(--muted);font-weight:600;margin:14px 0 6px}
.chip.on{background:var(--accent-soft);color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:650;background:var(--surface-2);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;font-size:11px;font-weight:600;color:var(--faint)}
nav.tabs button.on{color:var(--text)}
nav.tabs svg{width:22px;height:22px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 8px;border-radius:12px;background:var(--surface-2);font-size:11.5px;color:var(--muted);font-weight:600;min-width:0}
.wd.today{background:var(--accent-soft);color:var(--text)}
.wd .marks{display:flex;gap:3px;height:8px}
.wd .plan{font-size:10px;color:var(--faint);font-weight:600;height:13px}
.day-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px}
.badge{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:750;color:#fff;flex:none;font-size:17px}
.hero{padding:20px}
.hero .disp{font-size:26px;font-weight:750;margin:2px 0 4px;line-height:1.1}
.sess-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);margin:0 -16px 12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ex-head{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left}
.ex-title{font-family:var(--display);font-size:18px;font-weight:650;margin:0;line-height:1.2}
.meta{font-size:13px;color:var(--muted);margin-top:3px}
.rule{font-size:12.5px;color:var(--muted);margin-top:8px;display:flex;gap:6px;align-items:center}
.sets{margin-top:14px;display:grid;gap:7px}
.set{display:grid;grid-template-columns:22px minmax(0,1fr) 14px minmax(0,1fr) 86px 42px;gap:6px;align-items:center}
.set.noW{grid-template-columns:22px minmax(0,1fr) 86px 42px}
.set.chk{grid-template-columns:22px 1fr 42px}
.set .n{font-size:12px;color:var(--faint);font-weight:700;text-align:center}
.set .x{color:var(--faint);text-align:center;font-size:13px}
.set input{width:100%;height:44px;border-radius:11px;border:1px solid transparent;background:var(--surface-2);text-align:center;font-weight:650;font-size:17px;outline:none;padding:0 4px;font-variant-numeric:tabular-nums}
.set input:focus{border-color:var(--accent)}
.set input::placeholder{color:var(--faint);font-weight:500}
.set .hdr{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;text-align:center;font-weight:650}
.int{height:44px;border-radius:11px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.int.Easy{background:var(--good-soft);color:var(--good)}
.int.Moderate{background:var(--warn-soft);color:var(--warn)}
.int.Hard{background:var(--bad-soft);color:var(--bad)}
.done-btn{width:42px;height:44px;border-radius:11px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--faint)}
.done-btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.set.is-done input{opacity:.7}
.streak{display:flex;gap:16px;align-items:center}
.streak .big{font-family:var(--display);font-size:44px;font-weight:750;line-height:1;font-variant-numeric:tabular-nums}
.goal-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-top:8px}
.goal-row .pips{display:flex;gap:4px;flex:1}
.goal-row .pips i{flex:1;height:8px;border-radius:4px;background:var(--surface-2);max-width:44px}
.goal-row .pips i.on{background:var(--accent)}
.goal-row .pips.c i.on{background:var(--c-ca)}
.msg{margin-top:12px;font-size:13.5px;color:var(--text);background:var(--surface-2);border-radius:11px;padding:10px 12px}
.ms{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ms:first-of-type{border-top:0}
.ms .medal{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:750;font-size:13px;background:var(--surface-2);color:var(--muted);grid-row:span 2}
.ms .medal.on{background:var(--accent);color:var(--accent-ink)}
.ms .bar{grid-column:2 / 4;height:5px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.ms .bar i{display:block;height:100%;background:var(--accent)}
.sess-prog{height:3px;background:var(--surface-2);border-radius:3px;margin-top:10px;overflow:hidden}
.sess-prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.ex-done{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.ex-done .tick{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;flex:none}
.wd{cursor:pointer}
.hint.down{background:var(--warn-soft);color:var(--warn)}
.cal button.rest{background:var(--rest-soft)}.cal button.rest .num{color:var(--rest)}.cal button.rest.sel{box-shadow:inset 0 0 0 1.5px var(--rest)}
.hint{display:flex;gap:8px;align-items:center;background:var(--good-soft);color:var(--good);border-radius:11px;padding:9px 12px;font-size:13px;font-weight:650;margin-top:10px}
.cues{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:13.5px}
.cues ul{margin:6px 0 0;padding-left:18px}.cues li{margin:2px 0}
.cues .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:650}
.cue-btn{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-size:12px;font-weight:650;flex:none}
.cue-btn.on{background:var(--accent-soft);color:var(--accent)}
.toggle{position:relative;width:46px;height:28px;border-radius:999px;background:var(--line);flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.toggle.on{background:var(--accent)}.toggle.on::after{transform:translateX(18px)}
.check-list{margin:10px 0 0;padding:0;list-style:none}
.check-list li{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.check-list li.mob{align-items:flex-start}
.mob-name{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:3px 0;font-size:14px;color:var(--text)}
.mob-cue{font-size:13px;color:var(--muted);line-height:1.45;padding:2px 0 4px}
.cb{width:24px;height:24px;border-radius:8px;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--accent-ink)}
.cb.on{background:var(--accent);border-color:var(--accent)}
.timer{white-space:nowrap;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--text);color:var(--bg);border-radius:999px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;font-weight:700;font-variant-numeric:tabular-nums;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.timer button{background:color-mix(in srgb,var(--bg) 20%,transparent);color:var(--bg);height:30px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700}
.timer.over{background:var(--accent);color:var(--accent-ink)}.timer.over button{color:var(--accent-ink)}
.ctimer{text-align:center;padding:22px 16px}
.ctimer .seg-name{font-family:var(--display);font-size:22px;font-weight:700;margin-top:6px}
.ctimer .clock{font-family:var(--display);font-size:64px;font-weight:750;line-height:1;margin:10px 0 6px;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.ctimer .bar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin:14px 0 6px}
.ctimer .bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.ctimer.Hard .clock{color:var(--bad)}.ctimer.Moderate .clock{color:var(--warn)}
.seg-list{margin-top:6px;max-height:300px;overflow:auto}
.seg-row{display:grid;grid-template-columns:52px 1fr auto;gap:10px;padding:7px 4px;border-top:1px solid var(--line);font-size:13px;align-items:center}
.seg-row.cur{background:var(--accent-soft);border-radius:8px;border-color:transparent}
.seg-row.past{opacity:.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--surface);border-radius:14px;padding:12px 14px;min-width:0}
.tile .k{font-size:11.5px;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--display);font-size:26px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .d{font-size:12px;color:var(--muted)}
.chart{width:100%;display:block;overflow:visible}
.chart text{fill:var(--faint);font-size:10.5px;font-family:var(--body)}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
table.t{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.t td,table.t th{padding:9px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:11px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.06em}
.pr{color:var(--warn);font-weight:700}
.lift-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line);font-size:14px;color:var(--text)}
.lift-row:first-child{border-top:0}
.lift-row b{min-width:36px;text-align:right}
.spark{width:64px;height:20px;flex:none}
.sheet-sess .card{background:var(--surface-2);margin:12px 0 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;color:var(--faint);text-align:center;font-weight:650;padding-bottom:4px}
.cal button{aspect-ratio:1/1.08;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:4px;font-size:13px;font-weight:600;color:var(--text);background:transparent;min-width:0;max-width:100%}
.cal button.out{color:var(--faint);opacity:.45}
.cal button.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.cal button.sel{background:var(--surface-2)}
.cal .marks{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;padding:0 3px}
.cal .marks i{width:16px;height:5px;border-radius:3px;display:block}
.cal button.trained{color:var(--surface);justify-content:center;padding-top:0;gap:0}
.cal button.trained .tiny{font-size:10px;opacity:.85;line-height:1}
.cal button.trained.out{opacity:.4}
.cal button.trained.today{box-shadow:inset 0 0 0 2px var(--surface),0 0 0 2px var(--accent)}
.cal button.trained.sel{box-shadow:inset 0 0 0 2px var(--surface),0 0 0 2px var(--text)}
.cal button.rest{justify-content:center;padding-top:0}
.heat-wrap{overflow-x:auto;padding-bottom:4px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,var(--cell));gap:3px;width:max-content}
.heat i{width:var(--cell);height:var(--cell);border-radius:3px;background:var(--surface-2);display:block}
.heat i.blank{background:transparent}
.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px}
.seg button{height:32px;padding:0 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text)}
.year-row{padding:14px 0;border-top:1px solid var(--line)}
.year-row:first-child{border-top:0;padding-top:0}
.scrim{position:fixed;inset:0;background:rgba(20,18,14,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px 16px calc(22px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
@media(min-width:700px){.scrim{align-items:center}.sheet{border-radius:22px}}
.sheet h2{margin:0 0 4px;font-size:22px}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(24px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.scrim,.sheet{animation:none}.toggle,.toggle::after{transition:none}}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.prog-ex{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.prog-ex:first-of-type{border-top:0}
.set-edit{display:grid;grid-template-columns:24px 1fr 1fr 32px;gap:6px;align-items:center;margin-bottom:6px}
.seg-edit{display:grid;grid-template-columns:minmax(0,1.6fr) 60px minmax(0,1fr) minmax(0,1fr) 28px;gap:5px;align-items:center;margin-bottom:5px}
.seg-edit .field{min-height:38px;padding:6px 7px;font-size:13px}
.tagpick{display:flex;flex-wrap:wrap;gap:6px}
.tagpick button{height:34px;padding:0 12px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:600;color:var(--muted)}
.tagpick button.on{background:var(--accent-soft);color:var(--accent)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.pill-status{font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill-status i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.pill-status.synced i{background:var(--good)}
.list-item{display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.stripe{width:4px;align-self:stretch;border-radius:4px;flex:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>
<script>
"use strict";
/* ============================================================
   Lift Log v2: lifts, cardio, calendar and long-term progress.
   Standalone: data lives in this browser. Export to back up.
   On claude.ai it syncs through the page's database.
   ============================================================ */

const LS_KEY = "liftlog.v1";
const LS_DRAFT = "liftlog.draft.v1";
const INTS = ["Easy", "Moderate", "Hard"];
const TAGS = {
  strength: { label: "Strength", color: "var(--c-push)" },

    if (s.pts.length > 1 && !s.dotsOnly) g += `<path d="${P.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join("")}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2.25}" stroke-linejoin="round" stroke-linecap="round" ${s.dashed ? 'stroke-dasharray="5 5"' : ""}/>`;
    if (s.dots || s.dotsOnly || s.pts.length === 1) g += P.map((p, i) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i === P.length - 1 && !s.dotsOnly ? 4.5 : (s.r || 3.2)}" fill="${s.dotsOnly || i === P.length - 1 ? s.color : "var(--surface)"}" stroke="${s.color}" stroke-width="2"/>`).join("");

}
function niceTicks(a, b, n) {

    r.readAsText(el.files[0]); el.value = "";
    return;
  }
  if (a === "alt") { const ei = Number(el.dataset.ei), dex = draft.exercises[ei], t = tmplFor(dex), fresh = buildDraftEx(t, el.value); fresh.tid = dex.tid; draft.exercises[ei] = fresh; saveDraft(); render(); }
  else if (a === "progEx") { ui.progEx = el.value; render(); }
  else if (a === "rules") { S.program.rules = el.value.split("\n").map(x => x.trim()).filter(Boolean); persist("program"); toast("Rules saved"); }
});
async function download(name, text, type) {
  if (window.claude && typeof window.claude.use === "function") {
    try {
      const dl = await Promise.race([window.claude.use("downloads"), new Promise(r => setTimeout(() => r(null), 2000))]);
      if (dl) { await dl.save({ filename: name, data: text }); toast("Saved " + name); return; }
    } catch (e) { toast(e && e.code === "unavailable" ? "Downloads aren't available here" : "Download cancelled"); return; }
  }
  const blob = new Blob([text], { type }), a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast("Downloaded " + name);
}
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (ui.view === "progress" || ui.view === "body") render(); }, 150); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && draft && draft.type === "cardio" && draft.clock.running) keepAwake(true); });

saveLocal();
render();
cloud.init();
</script>
